<style>
/* ============ tokens ============ */
:root{
  --bg:#F2F6FA; --band:#E7EEF5; --card:#FFFFFF; --canvas:#FAFCFE; --code:#EDF3F9;
  --ink:#0B1F3A; --ink2:#22395A; --muted:#4F6079; --hair:#D5E0EB; --rule:#A7BBD0;
  --grid:#E9F0F6; --grid2:#DCE6F0;
  --local:#0079C8; --local-bg:#E2F0FA;
  --org:#007A69; --org-bg:#DCF0EB;
  --pub:#A35700; --pub-bg:#FAEDDB;
  --agent:#5A3DAE; --agent-bg:#ECE7F7;
  --block:#BE2830; --block-bg:#F9E3E4;
  --focus:#0079C8;
  --brand:#0079C8; --brand-ink:#FFFFFF; --brand-soft:#CFE7F7;
  --sans:'Montserrat',ui-sans-serif,'Segoe UI',Arial,sans-serif;
  --display:'Montserrat',ui-sans-serif,'Segoe UI',Arial,sans-serif;
  --mono:'Montserrat',ui-sans-serif,'Segoe UI',Arial,sans-serif;
  --codefont:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#04162B; --band:#061D36; --card:#0A2442; --canvas:#05192F; --code:#0C2948;
    --ink:#E6F0FA; --ink2:#C3D4E6; --muted:#8FA6BF; --hair:#17345A; --rule:#2D5682;
    --grid:#0A2340; --grid2:#103059;

    --org:#3FCFB0; --org-bg:#0A2E2D;
    --pub:#F2B25C; --pub-bg:#2B2010;
    --agent:#B6A2FF; --agent-bg:#1E1A3C;
    --block:#FF7B76; --block-bg:#34171B;
    --focus:#4DB3F2;
    --brand:#06325C; --brand-ink:#FFFFFF; --brand-soft:#9CCBEB;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#04162B; --band:#061D36; --card:#0A2442; --canvas:#05192F; --code:#0C2948;

    color-scheme:dark;
}

/* ============ base ============ */
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:12.75px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
code{font-family:var(--codefont);font-size:.88em;background:var(--code);padding:0 4px;border:1px solid var(--hair);border-radius:2px;white-space:nowrap}
p{margin:0}
h2,h3{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:500}
.noscript{padding:24px}

/* corner ticks (registration marks) */
.ticks{position:relative}
.ticks::before{content:"";position:absolute;inset:-4px;pointer-events:none;--tc:var(--rule);
  background:
    linear-gradient(var(--tc),var(--tc)) left top/9px 1px no-repeat,
    linear-gradient(var(--tc),var(--tc)) left top/1px 9px no-repeat,
    linear-gradient(var(--tc),var(--tc)) right top/9px 1px no-repeat,
    linear-gradient(var(--tc),var(--tc)) right top/1px 9px no-repeat,
    linear-gradient(var(--tc),var(--tc)) left bottom/9px 1px no-repeat,
    linear-gradient(var(--tc),var(--tc)) left bottom/1px 9px no-repeat,
    linear-gradient(var(--tc),var(--tc)) right bottom/9px 1px no-repeat,
    linear-gradient(var(--tc),var(--tc)) right bottom/1px 9px no-repeat}

/* classification stamp */
.where{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:1px 6px 1px 5px;border:1px solid currentColor;border-radius:2px;line-height:1.5;white-space:nowrap;background:var(--card)}
.where::before{content:"";width:5px;height:5px;background:currentColor;flex:none}
.where.local{color:var(--local);background:var(--local-bg)}
.where.org{color:var(--org);background:var(--org-bg)}
.where.pub{color:var(--pub);background:var(--pub-bg)}
.where.block{color:var(--block);background:var(--block-bg)}
.where.block::before{background:none;border:1px solid currentColor;width:6px;height:6px;transform:rotate(45deg)}

/* ============ shell ============ */
:root{
  --sans:'Plus Jakarta Sans',ui-sans-serif,'Segoe UI',Arial,sans-serif;
  --display:'Plus Jakarta Sans',ui-sans-serif,'Segoe UI',Arial,sans-serif;
  --mono:'Plus Jakarta Sans',ui-sans-serif,'Segoe UI',Arial,sans-serif;
  --guide-bg:#F8FAFC;
  --guide-panel:#FFFFFF;
  --guide-panel-2:#FCFDFE;
  --guide-line:#E2E8F0;
  --guide-text:#020617;
  --guide-muted:#475569;
  --guide-soft:#F1F5F9;
  --guide-accent:#0369A1;
}
:root[data-theme="dark"]{
  --guide-bg:#08111F;
  --guide-panel:#0E1726;
  --guide-panel-2:#101B2C;
  --guide-line:#22324A;
  --guide-text:#E8EEF8;
  --guide-muted:#9FB0C7;
  --guide-soft:#132034;
  --guide-accent:#60A5FA;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --guide-bg:#08111F;
    --guide-panel:#0E1726;
    --guide-panel-2:#101B2C;
    --guide-line:#22324A;
    --guide-text:#E8EEF8;
    --guide-muted:#9FB0C7;
    --guide-soft:#132034;
    --guide-accent:#60A5FA;
  }
}
body{background:var(--guide-bg);color:var(--guide-text);font-family:var(--sans)}
#app{height:100vh;height:100dvh}
.shell{height:100%;min-height:0;display:grid;grid-template-columns:214px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.partner-logo{display:block;height:18px;width:auto;opacity:.98}
.theme{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--guide-line);background:var(--guide-panel);cursor:pointer;border-radius:12px;color:var(--guide-text)}
.theme:hover{border-color:color-mix(in srgb,var(--guide-accent) 35%,var(--guide-line));background:var(--guide-soft)}
.theme svg{width:14px;height:14px}

.rail{grid-column:1;grid-row:1;background:var(--guide-panel);border-right:1px solid var(--guide-line);display:flex;flex-direction:column;min-height:0;overflow:auto}
.rail-inner{padding:14px 14px 28px}
.side-brand{display:flex;flex-direction:column;gap:18px;margin-bottom:18px;padding:8px 6px 4px}
.mark{display:flex;align-items:center;flex:none}
.mark .logo{display:block;height:36px;width:auto;max-width:196px}
.mark .logo.dark{display:none}
:root[data-theme="dark"] .brand-meta{border-color:var(--guide-line)}
:root[data-theme="dark"] .brand-meta .partner-logo{filter:none}
:root[data-theme="dark"] .brand-meta .theme{background:var(--guide-panel)}
:root[data-theme="dark"] .mark .logo.light{display:none}
:root[data-theme="dark"] .mark .logo.dark{display:block}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .mark .logo.light{display:none}
  :root:not([data-theme="light"]) .mark .logo.dark{display:block}
}
.brand-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:2px}
.search-wrap{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;background:var(--guide-panel);border:1px solid var(--guide-line);border-radius:10px}
.search-icon{font-size:14px;line-height:1;color:#94A3B8}
.rail-search{width:100%;border:0;background:transparent;padding:0;font:inherit;color:var(--guide-text)}
.rail-search::placeholder{color:#94A3B8}
.rail-search:focus{outline:0}
.rail .cap{padding:0 8px 8px;color:var(--guide-muted)}
.chapters{display:flex;flex-direction:column;padding:0}
.chapters button{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);gap:0 8px;text-align:left;background:none;border:0;padding:6px 8px 6px 12px;border-radius:8px;cursor:pointer;color:var(--guide-muted);transition:background-color .18s ease}
.chapters button .n{font-family:var(--mono);font-size:10px;padding-top:2px;color:#94A3B8}
.chapters button .t{font-weight:500;font-size:13px;line-height:1.4;color:var(--guide-muted)}
.chapters button .d{display:none}
.chapters button::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:999px;background:var(--guide-accent);transform:scaleY(0);transform-origin:top;transition:transform .18s ease}
.chapters button:hover{background:var(--guide-panel-2)}
.chapters button:hover .t{color:var(--guide-text)}
.chapters button[aria-selected="true"]{background:transparent;color:var(--guide-text)}
.chapters button[aria-selected="true"] .t,.chapters button[aria-selected="true"] .n{color:var(--guide-text);font-weight:600}
.chapters button[aria-selected="true"]::before{transform:scaleY(1)}
.rail .foot{margin-top:18px;padding:14px 8px 0;border-top:1px solid var(--guide-line);display:grid;gap:8px;color:var(--guide-muted)}
.rail .foot .k{display:flex;align-items:center;gap:8px;font-size:11px;line-height:1.45}
.rail .foot .k i{width:10px;height:10px;border:0;background:currentColor;flex:none;border-radius:2px}

.panel{grid-column:2;grid-row:1;min-width:0;min-height:0;overflow:auto;padding:12px 28px 48px;display:flex;flex-direction:column;gap:32px;scroll-behavior:smooth}
.chead{flex:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,320px);grid-template-areas:"mono desc" "title desc";align-items:end;gap:2px 18px;padding:6px 0 5px;border-bottom:1px solid var(--guide-line)}
.chead .mono{grid-area:mono;margin:0;color:var(--guide-accent);font-size:10px;line-height:1.2}
.chead h2{grid-area:title;margin:0;font-family:var(--display);font-weight:700;font-size:18px;line-height:1.08;letter-spacing:-.01em;color:var(--guide-text)}
.chead p{grid-area:desc;align-self:end;margin:0;color:var(--guide-muted);font-size:11px;line-height:1.35;max-width:none}
.fill{flex:1;min-height:0}
@media (prefers-reduced-motion:no-preference){
  .enter{animation:enter .4s cubic-bezier(.2,.7,.2,1) both}
  .enter:nth-child(2){animation-delay:.05s}.enter:nth-child(3){animation-delay:.1s}.enter:nth-child(4){animation-delay:.15s}
  @keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rail{grid-column:1;grid-row:1;overflow:visible;border-right:0;border-bottom:1px solid var(--guide-line)}
  .panel{grid-column:1;grid-row:2;padding:8px 18px 32px}
  .rail-inner{padding:12px 14px}
  .chapters{flex-direction:row;overflow-x:auto;scrollbar-width:none;padding:0}
  .chapters::-webkit-scrollbar{display:none}
  .chapters button{grid-template-columns:auto auto;gap:6px;padding:9px 12px;flex:none}
  .chapters button .n{padding-top:1px}
  .chapters button::before{left:10px;right:10px;top:auto;bottom:0;width:auto;height:2px;transform:scaleX(0);transform-origin:left}
  .chapters button[aria-selected="true"]::before{transform:scaleX(1)}
}
@media (max-width:640px){
  .panel{padding:8px 14px 28px}
  .chead{grid-template-columns:minmax(0,1fr);grid-template-areas:"mono" "title" "desc";gap:2px}
  .chead h2{font-size:17px}
}
@media (prefers-reduced-motion:reduce){.panel{scroll-behavior:auto}.chapters button::before{transition:none}}


/* ============ overview ============ */
.ov{max-width:1240px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:38px;padding-top:12px}
.cover{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:72px;align-items:start}
.cover .kick{color:var(--org);display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cover .kick::after{content:"";flex:1;height:1px;background:var(--hair)}
.cover h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,3.6vw,46px);line-height:1.04;letter-spacing:-.02em;margin:0 0 14px}
.cover h2 em{font-style:italic;color:var(--org)}
.cover .lead{font-size:13.5px;line-height:1.6;color:var(--ink2);max-width:58ch}
.cover .lead b{color:var(--ink)}
.jump{list-style:none;margin:28px 0 0;padding:0;display:grid;border-top:1px solid var(--ink);max-width:500px}
.jump button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:8px;text-align:left;background:none;border:0;border-bottom:1px solid var(--hair);padding:9px 2px;cursor:pointer}
.jump button .n{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.jump button .t{font-weight:600;font-size:12.5px}
.jump button .a{font-family:var(--mono);font-size:12px;color:var(--muted);transition:transform .2s}
.jump button:hover .a{transform:translateX(4px);color:var(--ink)}
.jump button:hover .t{text-decoration:underline;text-underline-offset:3px}
.ledger{background:var(--card);border:1px solid var(--hair);padding:14px 18px 6px}
.ledger header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:7px;color:var(--muted)}
.ledger header b{font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink);text-transform:none;letter-spacing:0}
.ledger ol{list-style:none;margin:0;padding:0}
.ledger li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair);font-size:12.5px}
.ledger li:last-child{border-bottom:0}
.ledger li .n{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.ledger li .ok{display:grid;place-items:center;width:18px;height:18px;border:1px solid var(--org);color:var(--org)}
.ledger li .ok svg{width:11px;height:11px}

.perim{display:flex;flex-direction:column;gap:8px}
.perim .phead{display:flex;align-items:baseline;gap:12px;color:var(--muted)}
.perim .phead::after{content:"";flex:1;height:1px;background:var(--hair)}
.band{position:relative;border:1px solid;padding:26px 16px 16px}
.band>.lbl{position:absolute;top:-1px;left:-1px;display:flex;align-items:center;gap:8px;padding:3px 9px;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.band .row{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:8px 22px;align-items:start;margin-bottom:14px}
.band .row b{display:block;font-size:13.5px;font-weight:700;color:var(--ink)}
.band .row p{color:var(--muted);font-size:12px;margin-top:2px}
.band .row ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.band .row li{font-size:11.5px;color:var(--ink2);background:var(--card);border:1px solid var(--hair);padding:3px 8px}
.band.p{border-color:var(--pub);border-style:dashed;background:repeating-linear-gradient(-45deg,transparent 0 7px,color-mix(in srgb,var(--pub) 7%,transparent) 7px 8px)}
.band.p>.lbl{background:var(--pub);color:var(--bg)}
.band.o{border-color:var(--org);background:var(--bg)}
.band.o>.lbl{background:var(--org);color:var(--bg)}
.band.l{border-color:var(--local);border-width:1.5px;background:var(--local-bg);margin-bottom:0}
.band.l>.lbl{background:var(--local);color:var(--bg)}
.band.l .row{margin-bottom:0}
.band.l::before{--tc:var(--local)}
@media (max-width:900px){.cover{grid-template-columns:minmax(0,1fr);gap:30px}.band .row{grid-template-columns:minmax(0,1fr)}.band{padding:26px 10px 10px}}

/* ============ split views ============ */
.split{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px}
.split>*{min-width:0}
.fig{display:flex;flex-direction:column;min-height:0;border:1px solid var(--ink);background:var(--canvas)}
.fig>header{flex:none;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--hair);background:var(--card)}
.fig>header .mono{color:var(--ink)}
.key{display:flex;flex-wrap:wrap;gap:4px 14px;margin-left:auto}
.key span{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.key i{width:10px;height:10px;border:0;background:currentColor;flex:none;border-radius:2px}
.canvas{position:relative;flex:1;min-height:0;overflow:hidden}
.side{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:2px}
.sec{border-top:1px solid var(--ink);padding-top:10px}
.sec>.mono{color:var(--muted);display:block;margin-bottom:4px}
.sec h3{font-family:var(--display);font-weight:700;font-size:16.5px;line-height:1.1;margin-bottom:4px}
.sec h4{margin:0;font-size:12.5px;font-weight:700}
.hintline{font-size:11.5px;color:var(--muted)}
@media (max-width:1023px){.split{height:auto;grid-template-columns:minmax(0,1fr)}.fig .canvas{height:60vh;min-height:340px;flex:none}.side{overflow:visible}}

.info{position:absolute;left:10px;bottom:10px;z-index:5;max-width:min(360px,calc(100% - 70px));background:var(--card);border:1px solid var(--ink);padding:9px 30px 10px 12px;font-size:11.5px;box-shadow:4px 4px 0 var(--grid2)}
.info .mono{color:var(--muted);display:block;margin-bottom:2px}
.info b{display:block;margin-bottom:3px;font-size:12.5px}
.info button{position:absolute;right:4px;top:4px;width:22px;height:22px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
.info button:hover{color:var(--ink)}

/* scenario index */
.scn{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--hair)}
.scn button{position:relative;width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:6px;text-align:left;background:none;border:0;border-bottom:1px solid var(--hair);padding:6px 6px 6px 10px;cursor:pointer;font-size:12px;color:var(--ink2)}
.scn button .n{font-family:var(--mono);font-size:10px;color:var(--muted)}
.scn button .c{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.scn button:hover{background:var(--card);color:var(--ink)}
.scn button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600}
.scn button[aria-pressed="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--org)}
.ctrl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:10px;border:1px solid var(--rule)}
.ctrl .btn{border:0;border-left:1px solid var(--rule);justify-content:center;padding:7px 4px;font-size:11px}
.ctrl .btn:first-child{border-left:0}
.ctrl .btn:focus-visible{outline-offset:-2px}

/* step timeline */
.steps{list-style:none;margin:8px 0 0;padding:0;position:relative}
.steps li{position:relative;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;padding:0 4px 12px 0;cursor:pointer}
.steps li::after{content:"";position:absolute;left:10px;top:22px;bottom:0;width:1px;background:var(--hair)}
.steps li:last-child::after{display:none}
.steps li .dot{width:21px;height:21px;display:grid;place-items:center;border:1px solid var(--rule);background:var(--card);font-family:var(--mono);font-size:10px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.steps li b{display:block;font-size:12.5px;line-height:1.35}
.steps li p{font-size:11.75px;color:var(--muted);margin:2px 0 6px;line-height:1.45}
.steps li:hover b{text-decoration:underline;text-underline-offset:3px}
.steps li.on .dot{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps li.on b{color:var(--ink)}
.steps li.on>div{background:var(--card);box-shadow:-8px 0 0 var(--card),8px 0 0 var(--card);outline:1px solid var(--hair);outline-offset:4px}
.steps li.done .dot{color:var(--ink);border-color:var(--ink)}

/* agent notes */
.anote{border-top:1px solid var(--hair);padding-top:9px}
.anote header{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.anote header .mono{color:var(--agent)}
.anote ul{list-style:none;margin:0;padding:0}
.anote li{position:relative;padding:3px 0 3px 16px;font-size:12px;color:var(--ink2)}
.anote li::before{content:"";position:absolute;left:2px;top:10px;width:7px;height:1px;background:var(--ink2)}

/* ============ react flow skin ============ */
.react-flow__attribution{background:transparent;font-size:9px}
.react-flow__attribution a{color:var(--muted)}
.react-flow__controls{box-shadow:none;border:1px solid var(--ink);border-radius:0;overflow:hidden}
.react-flow__controls-button{background:var(--card);border-bottom:1px solid var(--hair);fill:var(--ink);width:24px;height:24px}
.react-flow__controls-button:hover{background:var(--code)}
.react-flow__controls-button svg{fill:var(--ink)}
.react-flow__background path{stroke:var(--grid)}
.react-flow__background.major path{stroke:var(--grid2)}
.react-flow__node{cursor:pointer}
.react-flow__node.nopan{cursor:grab}
.react-flow__node.dragging{cursor:grabbing}
.canvas .reset{position:absolute;top:10px;right:10px;z-index:6;font-size:11px;padding:5px 10px}
.react-flow__node.dim{opacity:.3;transition:opacity .25s}
.react-flow__node-zone{cursor:grab}
.react-flow__node-zone.dragging{cursor:grabbing}
.react-flow__handle{opacity:0;width:6px;height:6px;min-width:0;min-height:0;border:0}

.zone{position:relative;width:100%;height:100%;border:1px solid;padding:0}
.zone::before{content:"";position:absolute;inset:-5px;pointer-events:none;--tc:currentColor;
  background:
    linear-gradient(var(--tc),var(--tc)) left top/12px 1.5px no-repeat,linear-gradient(var(--tc),var(--tc)) left top/1.5px 12px no-repeat,
    linear-gradient(var(--tc),var(--tc)) right top/12px 1.5px no-repeat,linear-gradient(var(--tc),var(--tc)) right top/1.5px 12px no-repeat,
    linear-gradient(var(--tc),var(--tc)) left bottom/12px 1.5px no-repeat,linear-gradient(var(--tc),var(--tc)) left bottom/1.5px 12px no-repeat,
    linear-gradient(var(--tc),var(--tc)) right bottom/12px 1.5px no-repeat,linear-gradient(var(--tc),var(--tc)) right bottom/1.5px 12px no-repeat}
.zone span{position:absolute;left:10px;top:-8px;background:var(--canvas);padding:0 6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;white-space:nowrap;line-height:15px}
.zone.local{color:var(--local);background:color-mix(in srgb,var(--local) 5%,transparent);border-width:1.5px}
.zone.org{color:var(--org);background:color-mix(in srgb,var(--org) 5%,transparent)}
.zone.pub{color:var(--pub);border-style:dashed;background:repeating-linear-gradient(-45deg,transparent 0 7px,color-mix(in srgb,var(--pub) 9%,transparent) 7px 8px)}
.zone.lane{color:var(--muted);border-color:var(--hair);border-left:3px solid var(--agent);background:color-mix(in srgb,var(--card) 70%,transparent)}
.zone.lane::before{display:none}
.zone.lane span{top:7px;left:10px;background:none;padding:0;color:var(--ink2)}

.cn{width:100%;height:100%;background:var(--card);border:1px solid var(--rule);padding:6px 9px 7px;display:flex;flex-direction:column;gap:2px;overflow:hidden;transition:box-shadow .25s,border-color .25s}
.cn .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;border-bottom:1px solid var(--hair);padding-bottom:3px;margin-bottom:2px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.cn .meta .tag{display:inline-flex;align-items:center;gap:4px}
.cn .meta .tag::before{content:"";width:5px;height:5px;background:currentColor}
.cn b{font-size:13px;line-height:1.22;font-weight:700}
.cn .sub{font-size:11.5px;color:var(--ink2);line-height:1.32}
.cn.k-local .tag{color:var(--local)}
.cn.k-agent{border-color:var(--agent);box-shadow:inset 3px 0 0 var(--agent)}
.cn.k-agent .tag{color:var(--agent)}
.cn.k-org .tag{color:var(--org)}
.cn.k-pub .tag{color:var(--pub)}
.cn.k-user{background:var(--ink);border-color:var(--ink)}
.cn.k-user b,.cn.k-user .sub,.cn.k-user .meta{color:var(--bg)}
.cn.k-user .meta{border-color:color-mix(in srgb,var(--bg) 25%,transparent)}
.cn.k-user .tag{color:var(--bg)}
.cn .rows{margin-top:5px;border-top:1px solid var(--hair)}
.cn .rows div{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--hair);font-size:10.5px;line-height:1.3;color:var(--ink2)}
.cn .rows em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--org);white-space:nowrap;border:1px solid currentColor;padding:1px 4px}
.cn ul{list-style:none;margin:6px 0 0;padding:0;font-size:11.5px;color:var(--ink2);border-top:1px solid var(--hair)}
.cn ul li{padding:5px 0 5px 12px;border-bottom:1px solid var(--hair);position:relative;line-height:1.35}
.cn ul li::before{content:"";position:absolute;left:1px;top:11px;width:6px;height:1px;background:var(--org)}
.react-flow__node.hl .cn{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink),0 0 0 5px color-mix(in srgb,var(--org) 22%,transparent)}
.react-flow__node.hl .cn.k-agent{box-shadow:inset 3px 0 0 var(--agent),0 0 0 1px var(--ink),0 0 0 5px color-mix(in srgb,var(--org) 22%,transparent)}
.react-flow__node:focus-visible .cn{outline:2px solid var(--focus);outline-offset:2px}

.st{width:100%;height:100%;background:var(--card);border:1px solid var(--rule);padding:6px 9px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.st b{font-size:11px;line-height:1.25;font-weight:600}
.st .where{align-self:flex-start;font-size:8.5px}
.st.w-org{border-color:var(--org);box-shadow:inset 0 2px 0 var(--org)}
.st.end{border-color:var(--ink);box-shadow:3px 3px 0 var(--grid2)}

.react-flow__edge-path{stroke-width:1.5}
.react-flow__edge.e-local .react-flow__edge-path{stroke:var(--local)}
.react-flow__edge.e-org .react-flow__edge-path{stroke:var(--org);stroke-width:2}
.react-flow__edge.e-secret .react-flow__edge-path{stroke:var(--agent)}
.react-flow__edge.e-pub .react-flow__edge-path{stroke:var(--pub)}
.react-flow__edge.e-muted .react-flow__edge-path{stroke:var(--muted)}
.react-flow__edge .react-flow__edge-path{stroke-opacity:.55;stroke-width:1.6}
.flow-dots{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:0 8;animation:flowfwd 1.2s linear infinite;pointer-events:none}
.flow-dots.rev{stroke-width:2.4;opacity:.75;stroke-dashoffset:4;animation-name:flowrev}
@keyframes flowfwd{from{stroke-dashoffset:0}to{stroke-dashoffset:-16}}
@keyframes flowrev{from{stroke-dashoffset:4}to{stroke-dashoffset:20}}
.react-flow__edge.e-local .flow-dots{stroke:var(--local)}
.react-flow__edge.e-org .flow-dots{stroke:var(--org)}

  const CT_FLOWS = [
    { t: "Services up", d: "You ask, the agent names services, and ForgeQE asks you before anything starts. Only services forgeqe.yaml declares can start, with what they depend on first. ForgeQE builds the argument array itself: --security-opt no-new-privileges, --pids-limit 1024, ports published on 127.0.0.1 only, read-only mounts, and secrets by name (--env NAME), never ForgeQE's own keys. Each service joins the project's network forgeqe-<key> with its name as alias. ForgeQE waits until a port answers or an HTTP path answers below 500.", e: ["ct-you-agt", "ct-agt-fq", "ct-cfg-fq", "ct-env-fq", "ct-fq-dmn", "ct-dmn-svc", "ct-fq-svc"], w: "local" },
